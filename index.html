<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scam-Tron · Printable Answer Sheets</title>
<style>
:root{--green:#1f4b3a;--ink:#17201b;--cream:#f3f0e8;--line:#d8d3c8;--gold:#b78a3a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:11px}.seal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font:700 22px Georgia}.brand small,.eyebrow{display:block;font-size:10px;letter-spacing:.15em;font-weight:800;color:#666}.brand h1{font:700 25px Georgia;margin:2px 0}.actions{display:flex;gap:7px}.btn{padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;font-weight:700}.btn.green{background:var(--green);color:#fff}.btn.dark{background:var(--ink);color:#fff}.layout{display:grid;grid-template-columns:300px 1fr;max-width:1500px;margin:auto}.side{padding:26px 22px;background:#ebe7dc;border-right:1px solid var(--line);min-height:calc(100vh - 70px)}.side h2{font:700 22px Georgia;margin:5px 0 18px}.side label{display:block;font-size:12px;font-weight:700;margin:13px 0}.side input,.side select{width:100%;padding:9px;border:1px solid #c8c2b7;border-radius:4px;background:#fff;margin-top:5px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.side hr{border:0;border-top:1px solid #d0c9bd;margin:22px 0}.forms{display:flex;gap:5px;flex-wrap:wrap}.forms button{padding:7px 10px;border:1px solid #aaa;background:#fff;border-radius:4px}.forms .active{background:var(--green);color:#fff}.save-form{width:100%;margin-top:10px;padding:10px;border:1px solid var(--green);background:#fff;color:var(--green);font-weight:800;border-radius:4px}.saved{font-size:11px;margin-top:10px;line-height:1.6}.notice{color:var(--green);font-size:11px;font-weight:bold}.main{padding:26px 28px;min-width:0}.keyhead{display:flex;justify-content:space-between;align-items:end}.keyhead h2{font:700 22px Georgia;margin:5px 0}.tip{font-size:12px;color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));background:#fff;border-top:1px solid var(--line);border-left:1px solid var(--line)}.keyrow{display:grid;grid-template-columns:34px 1fr 78px;align-items:center;min-height:49px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.keyrow:focus{outline:2px solid var(--green);outline-offset:-2px;background:#f4f8f5}.keyrow strong{text-align:center}.choices{display:flex;gap:4px}.choices button{width:30px;height:30px;border:1px solid #bbb;background:#fff;border-radius:3px;font-weight:bold}.choices .picked{background:var(--green);color:#fff}.keyrow select{font-size:10px;padding:5px}.studio{margin-top:28px}.studiohead{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#ddd7ca;border:1px solid #c9c2b6;padding:13px;flex-wrap:wrap}.studiohead h3{margin:3px 0;font:700 18px Georgia}.studiohead>div:last-child{display:flex;gap:6px;flex-wrap:wrap}.preview{padding:25px;background:#d4d0c7;overflow:auto}.paper{--row:.43in;--box:.3in;position:relative;width:8.5in;height:11in;margin:auto;background:#fff;color:#000;padding:.46in .53in;box-shadow:0 2px 10px #0002}.sheethead{display:flex;justify-content:space-between;border-bottom:2px solid;padding-bottom:.13in}.sheethead h1{font:700 19pt Georgia;margin:.04in 0}.sheethead p{margin:0;font-size:9pt}.formbox{border:3px solid;width:1.5in;text-align:center;padding:.06in}.formbox span{display:block;font-size:8pt;font-weight:bold}.formbox b{font-size:28pt}.fields{display:grid;grid-template-columns:2fr 1.3fr 1fr;gap:.18in;margin:.15in 0}.fields span{font-size:8pt;display:flex;gap:.07in}.fields i{flex:1;border-bottom:1px solid}.answergrid{display:grid;gap:.3in}.answerrow{height:var(--row);display:flex;align-items:center;border-bottom:1px dotted #bbb}.answerrow .num{width:.34in;text-align:right;margin-right:.1in;font-size:9pt;font-weight:bold}.boxes{display:flex;gap:.055in}.box{width:var(--box);height:var(--box);display:grid;place-items:center;border:1.5px solid;border-radius:2px;font-size:8pt;font-weight:bold}.box.fill{background:#000;color:#000;print-color-adjust:exact}.write{margin-left:auto;width:.28in;border-bottom:1px solid;height:.18in}.column{min-width:0}.foot{position:absolute;bottom:.31in;left:.53in;right:.53in;border-top:1px solid;display:flex;justify-content:space-between;padding-top:.05in;font-size:7pt}.reg{position:absolute;width:.16in;height:.16in}.reg:before,.reg:after{content:"";position:absolute;background:#000}.reg:before{width:100%;height:1px;top:50%}.reg:after{height:100%;width:1px;left:50%}.tl{top:.17in;left:.17in}.tr{top:.17in;right:.17in}.bl{bottom:.17in;left:.17in}.br{bottom:.17in;right:.17in}.printonly{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.main{padding:18px 10px}.paper{transform:scale(.68);transform-origin:top left;margin-bottom:-3.4in}.top .actions .btn:not(.green){display:none}}@page{size:letter portrait;margin:0}@media print{body{background:#fff}.top,.layout{display:none}.printonly{display:block}.printonly .paper{margin:0;box-shadow:none;page-break-after:always}.printonly .paper:last-child{page-break-after:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="seal">H</span><div><small>HISTORY DEPARTMENT</small><h1>Scam-Tron</h1></div></div><div class="actions"><button class="btn" id="importBtn">Import JSON</button><button class="btn" id="exportBtn">Export assessment</button><button class="btn green" id="saveAssessment">Save assessment</button><input hidden type="file" id="file" accept=".json"></div></header>
<div class="layout"><aside class="side"><span class="eyebrow">ASSESSMENT SETUP</span><h2>Build answer keys</h2><label>Test title<input id="title"></label><label>Course / class<input id="course"></label><div class="pair"><label>Questions<input id="count" type="number" min="1" max="150"></label><label>Default choices<select id="defaultChoices"><option>2</option><option>3</option><option selected>4</option><option>5</option></select></label></div><hr><span class="eyebrow">FORMS</span><label>Form labels<input id="labels" value="A, B, C, D"></label><div class="forms" id="forms"></div><button class="save-form" id="saveForm">Save Form A</button><p class="notice" id="notice"></p><div class="saved" id="saved"></div><hr><span class="eyebrow">PAGE LAYOUT</span><div class="pair"><label>Columns<select id="columns"><option value="0">Auto (largest fit)</option><option value="1">1 column</option><option value="2">2 columns</option><option value="3">3 columns</option></select></label><label>Box size<select id="boxSize"><option>compact</option><option>standard</option><option selected>large</option></select></label></div><p style="font-size:11px;border-left:3px solid var(--gold);padding:9px;background:#f8f4e9">No accounts or student data. Everything stays in this browser.</p></aside>
<main class="main"><div class="keyhead"><div><span class="eyebrow" id="keyLabel">FORM A ANSWER KEY</span><h2 id="progress">0 of 40 answered</h2><p class="tip">Click a question, type A–E, then press Enter to continue.</p></div></div><div class="grid" id="keyGrid"></div><section class="studio"><div class="studiohead"><div><span class="eyebrow">PRINT STUDIO</span><h3 id="studioLabel">Form A</h3></div><div><button class="btn" id="exportKey">Export this key</button><button class="btn" id="printStudent">Print student</button><button class="btn dark" id="printKey">Print this key</button><button class="btn dark" id="printAll">Print all saved keys</button></div></div><div class="preview" id="preview"></div></section></main></div><div class="printonly" id="printRoot"></div>
<script>
const L=['A','B','C','D','E'],STORE='paperkey-standalone-v1';let active='A',printTimer;const $=id=>document.getElementById(id);let data=load()||fresh();
function fresh(){return{title:'Industrial Revolution Unit Test',course:'World History',count:40,defaultChoices:4,choiceCounts:Array(40).fill(4),formAnswers:{},savedForms:{},labels:['A','B','C','D']}}
function load(){try{return JSON.parse(localStorage.getItem(STORE))}catch{return null}}function persist(){localStorage.setItem(STORE,JSON.stringify(data))}
function answers(){return data.formAnswers[active]||(data.formAnswers[active]=Array(data.count).fill(null))}function labels(){return $('labels').value.split(',').map(x=>x.trim()).filter(Boolean)}
function syncInputs(){data.title=$('title').value;data.course=$('course').value;data.defaultChoices=+$('defaultChoices').value;data.labels=labels();persist()}
function render(){ $('title').value=data.title;$('course').value=data.course;$('count').value=data.count;$('defaultChoices').value=data.defaultChoices;$('labels').value=data.labels.join(', ');renderForms();renderGrid();renderPreview() }
function renderForms(){data.labels=labels();if(!data.labels.includes(active))active=data.labels[0]||'A';$('forms').innerHTML=data.labels.map(x=>`<button class="${x===active?'active':''}" data-form="${esc(x)}">Form ${esc(x)}</button>`).join('');$('saveForm').textContent=(data.savedForms[active]?'Update':'Save')+' Form '+active;$('saved').innerHTML='<b>Saved forms:</b> '+(Object.keys(data.savedForms).map(x=>'Form '+esc(x)).join(', ')||'None');$('keyLabel').textContent='FORM '+active+' ANSWER KEY';$('studioLabel').textContent='Form '+active}
function renderGrid(){let a=answers();$('progress').textContent=a.filter(Boolean).length+' of '+data.count+' answered';$('keyGrid').innerHTML=Array.from({length:data.count},(_,i)=>{let n=data.choiceCounts[i]||data.defaultChoices;return`<div class="keyrow" tabindex="0" data-i="${i}"><strong>${i+1}</strong><div class="choices">${L.slice(0,n).map(x=>`<button tabindex="-1" class="${a[i]===x?'picked':''}" data-answer="${x}">${x}</button>`).join('')}</div><select tabindex="-1">${[2,3,4,5].map(x=>`<option ${x===n?'selected':''}>${x}</option>`).join('')}</select></div>`}).join('')}
function version(form=active,saved=false){let a=saved&&data.savedForms[form]?data.savedForms[form].answers:(data.formAnswers[form]||Array(data.count).fill(null));return{label:form,answers:a,choiceCounts:[...data.choiceCounts],savedAt:data.savedForms[form]?.savedAt||null}}
function sheet(v,kind){let requested=+$('columns').value,cols=requested||Math.min(3,Math.max(1,Math.ceil(data.count/24))),rows=Math.ceil(data.count/cols),row=Math.max(.275,Math.min(.52,8.7/rows)),scale=$('boxSize').value==='compact'?.78:$('boxSize').value==='standard'?.9:1,box=Math.max(.2,Math.min(.34,row*.7))*scale,groups=Array.from({length:cols},(_,c)=>Array.from({length:Math.min(rows,data.count-c*rows)},(_,r)=>c*rows+r));return`<section class="paper" style="--row:${row}in;--box:${box}in"><i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i><div class="sheethead"><div><p>HISTORY DEPARTMENT</p><h1>${esc(data.title)}</h1><p>${esc(data.course)}</p></div><div class="formbox"><span>${kind==='key'?'TEACHER KEY':'TEST FORM'}</span><b>${esc(v.label)}</b></div></div><div class="fields"><span>Name <i></i></span><span>Class / Block <i></i></span><span>Date <i></i></span></div><div class="answergrid" style="grid-template-columns:repeat(${cols},1fr)">${groups.map(g=>`<div class="column">${g.map(i=>`<div class="answerrow"><span class="num">${i+1}.</span><div class="boxes">${L.slice(0,v.choiceCounts[i]||data.defaultChoices).map(x=>`<span class="box ${kind==='key'&&v.answers[i]===x?'fill':''}">${kind==='key'&&v.answers[i]===x?'':x}</span>`).join('')}</div><span class="write"></span></div>`).join('')}</div>`).join('')}</div><div class="foot"><span>Form ${esc(v.label)}</span><span>${kind==='key'?'MATCH ONLY WITH FORM '+esc(v.label):'Mark one box per question'}</span></div></section>`}
function renderPreview(){ $('preview').innerHTML=sheet(version(),'key') }
function setAnswer(i,a){answers()[i]=a;persist();renderGrid();renderPreview();setTimeout(()=>document.querySelector(`.keyrow[data-i="${i}"]`)?.focus(),0)}
function download(name,obj){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('forms').onclick=e=>{let b=e.target.closest('[data-form]');if(b){active=b.dataset.form;render()}};$('keyGrid').onclick=e=>{let row=e.target.closest('.keyrow');if(!row)return;let i=+row.dataset.i,b=e.target.closest('[data-answer]');if(b)setAnswer(i,b.dataset.answer)};$('keyGrid').onchange=e=>{let row=e.target.closest('.keyrow');if(row&&e.target.tagName==='SELECT'){data.choiceCounts[+row.dataset.i]=+e.target.value;persist();renderGrid();renderPreview()}};$('keyGrid').onkeydown=e=>{let row=e.target.closest('.keyrow');if(!row)return;let i=+row.dataset.i,k=e.key.toUpperCase(),n=data.choiceCounts[i]||data.defaultChoices;if(L.includes(k)&&L.indexOf(k)<n){e.preventDefault();setAnswer(i,k)}if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();document.querySelector(`.keyrow[data-i="${Math.min(i+1,data.count-1)}"]`)?.focus()}if(e.key==='ArrowUp'){e.preventDefault();document.querySelector(`.keyrow[data-i="${Math.max(i-1,0)}"]`)?.focus()}};
$('saveForm').onclick=()=>{data.savedForms[active]={answers:[...answers()],choiceCounts:[...data.choiceCounts],savedAt:new Date().toISOString()};persist();$('notice').textContent=`Form ${active} saved with ${answers().filter(Boolean).length} answers.`;renderForms();setTimeout(()=>$('notice').textContent='',3000)};$('saveAssessment').onclick=()=>{syncInputs();$('notice').textContent='Assessment saved.'};$('exportBtn').onclick=()=>download((data.title||'assessment')+'.json',data);$('exportKey').onclick=()=>download('form-'+active+'-answer-key.json',version());$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{data=JSON.parse(await e.target.files[0].text());active=data.labels?.[0]||'A';persist();render()};
function print(kind,all=false){let vs=all?Object.keys(data.savedForms).map(x=>version(x,true)):[version()];$('printRoot').innerHTML=vs.map(v=>sheet(v,kind)).join('');clearTimeout(printTimer);printTimer=setTimeout(()=>window.print(),50)}$('printStudent').onclick=()=>print('student');$('printKey').onclick=()=>print('key');$('printAll').onclick=()=>print('key',true);
$('title').oninput=$('course').oninput=()=>{syncInputs();renderPreview()};$('labels').onchange=()=>{syncInputs();render()};$('defaultChoices').onchange=e=>{data.defaultChoices=+e.target.value;data.choiceCounts=Array(data.count).fill(data.defaultChoices);persist();render()};$('count').onchange=e=>{let n=Math.max(1,+e.target.value);data.choiceCounts=Array.from({length:n},(_,i)=>data.choiceCounts[i]||data.defaultChoices);Object.keys(data.formAnswers).forEach(k=>data.formAnswers[k]=Array.from({length:n},(_,i)=>data.formAnswers[k][i]||null));data.count=n;persist();render()};$('columns').onchange=$('boxSize').onchange=renderPreview;render();
</script>
</body>
</html>
<style>.formtop{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #ccc;margin-bottom:16px}.formtop .forms button{border-radius:5px 5px 0 0;padding:11px 18px}.formtop .save-form{width:auto;margin:0 0 6px}.bulkbox{display:grid;grid-template-columns:320px 1fr;gap:12px;background:#fff;border:1px solid #d8d3c8;padding:13px;margin-bottom:16px}.bulkbox textarea{display:block;width:100%;height:125px;margin-top:6px;font:14px/1.4 monospace}.bulkbox>div{padding-top:23px}@media(max-width:700px){.bulkbox{grid-template-columns:1fr}}</style>
<script>
(()=>{const main=document.querySelector('.main'),forms=document.getElementById('forms'),save=document.getElementById('saveForm');if(!main||!forms||!save)return;const top=document.createElement('div');top.className='formtop';forms.parentNode.removeChild(forms);save.parentNode.removeChild(save);top.append(forms,save);main.prepend(top);const bulk=document.createElement('div');bulk.className='bulkbox';bulk.innerHTML='<label><b>Paste answers, one per line</b><textarea id="bulkAnswers" placeholder="A\nB\nD"></textarea></label><div><button class="btn dark" id="applyBulkAnswers">Apply to current form</button><p class="tip">Blank lines leave questions unanswered.</p></div>';top.after(bulk);document.getElementById('applyBulkAnswers').onclick=()=>{const lines=document.getElementById('bulkAnswers').value.replace(/\r/g,'').split('\n');data.formAnswers[active]=Array.from({length:data.count},(_,i)=>{const v=(lines[i]||'').trim().toUpperCase(),n=data.choiceCounts[i]||data.defaultChoices;return L.includes(v)&&L.indexOf(v)<n?v:null});persist();renderGrid();renderPreview();document.getElementById('notice').textContent=lines.length+' lines applied to Form '+active+'.'};let digits='',timer;const old=document.getElementById('keyGrid').onkeydown;document.getElementById('keyGrid').onkeydown=e=>{if(/^\d$/.test(e.key)){e.preventDefault();digits+=e.key;clearTimeout(timer);timer=setTimeout(()=>{const n=+digits;digits='';document.querySelector('.keyrow[data-i="'+(n-1)+'"]')?.focus()},2000);return}if(e.key==='Enter'&&digits){e.preventDefault();clearTimeout(timer);const n=+digits;digits='';document.querySelector('.keyrow[data-i="'+(n-1)+'"]')?.focus();return}old(e)};})();
</script>
